<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prabhanjan Meher Star</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #0b1d51, #000000);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }.stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background: transparent;
  overflow: hidden;
}

.stars span {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  border-radius: 50%;
  animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
  0%,100% { opacity: 0.2; }
  50% { opacity: 1; }
}

.card {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.08);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  backdrop-filter: blur(10px);
  box-shadow: 0 0 30px rgba(255,255,255,0.2);
  max-width: 500px;
}

h1 {
  font-size: 3rem;
  margin-bottom: 10px;
  color: #ffd700;
}

h2 {
  margin-top: 0;
  font-weight: normal;
  color: #ccc;
}

.star {
  font-size: 5rem;
  color: gold;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px gold; }
  to { text-shadow: 0 0 30px gold, 0 0 50px white; }
}

p {
  line-height: 1.7;
  color: #e0e0e0;
}

.footer {
  margin-top: 20px;
  font-size: 0.9rem;
  color: #aaa;
}

  </style>
</head>
<body>
  <div class="stars" id="stars"></div>  <div class="card">
    <div class="star">★</div>
    <h1>Prabhanjan Meher Star</h1>
    <h2>A Symbolic Star in the Infinite Sky</h2><p>
  This star is dedicated to <strong>Prabhanjan Meher</strong> —
  a name that shines with ambition, strength, and dreams.
</p>

<p>
  "Some stars are discovered in the sky,
  and some are born on Earth."
</p>

<div class="footer">
  Created with ✨ for Prabhanjan Meher
</div>

  </div>  <script>
    const starsContainer = document.getElementById('stars');

    for (let i = 0; i < 150; i++) {
      const star = document.createElement('span');
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.opacity = Math.random();
      starsContainer.appendChild(star);
    }
  </script></body>
</html>
